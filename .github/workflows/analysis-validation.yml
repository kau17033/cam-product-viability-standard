name: CAM additive analysis validation
on:
  pull_request:
    paths:
      - "analysis/**"
      - "tests/analysis.test.cjs"
      - "formal/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - ".github/workflows/analysis-validation.yml"
      - "docs/analysis-contract-v1.md"
  push:
    branches: [main]
    paths:
      - "analysis/**"
      - "tests/analysis.test.cjs"
      - "formal/**"
      - "lakefile.lean"
      - "lean-toolchain"
      - ".github/workflows/analysis-validation.yml"
      - "docs/analysis-contract-v1.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arithmetic-and-smt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/analysis.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install z3-solver==4.16.0.0
      - run: python formal/check_z3.py
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: "true"
