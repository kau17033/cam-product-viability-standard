[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cam-verdict"
version = "2.0.0"
description = "CAM — Product Viability Standard: for items sold but no profit left （売れたのに残らない）, deterministic per-order profit verdicts (TEST_CANDIDATE / HOLD / REJECT) counting all six cost items including a return reserve — decide whether a product is worth stocking before you buy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["product-viability", "profit-calculator", "dropshipping", "ecommerce", "mcp"]

[project.urls]
Homepage = "https://kau17033.github.io/cam-product-viability-standard/"
Repository = "https://github.com/kau17033/cam-product-viability-standard"

[project.scripts]
cam-verdict = "cam_verdict.cli:main"
cam-verdict-mcp = "cam_verdict.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cam_verdict"]
